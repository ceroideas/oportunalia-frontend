<!-- <div class="section testimonials"> -->
  <div class="section">
    <div class="px-3">
        <div class="theme-container">
            <!-- <h1 class="section-title">1</h1> -->

            <div class="testimonials-carousel">
                <div class="swiper-container h-100" [swiper]="config">
                    <div class="swiper-wrapper h-100">
                        <div *ngFor="let testimonial of testimonials; index as i" class="swiper-slide">
                            <div class="content text-center">
                                <img [attr.data-src]="testimonial.image" class="swiper-lazy">
                                <h1 class="section-title">{{i+1}}</h1>
                                <div class="quote open text-left primary-color">“</div>
                                <p class="text">{{testimonial.text}}</p>
                                <div class="quote close text-right primary-color">”</div>
                                <h3 class="author">{{testimonial.author}}</h3>
                                <p>{{testimonial.position}}</p>
                                <div class="swiper-lazy-preloader"></div>
                            </div>
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>

        </div>
    </div>
</div>
