<mat-toolbar id="main-toolbar" class="mat-elevation-z2">
  <div class="theme-container" fxLayout="row" fxLayoutAlign="space-between center">
    <a class="logo" routerLink="/" ><app-logo></app-logo></a>
    <div fxShow="false" fxShow.gt-sm class="horizontal-menu">
        <app-horizontal-menu [menuParentId]="0"></app-horizontal-menu>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center">
      <a *ngIf="userService.isLoggedIn" routerLink="/account/favorites" mat-icon-button matTooltip="Favoritos" fxShow="false" fxShow.gt-md>
          <mat-icon [matBadge]="appService.Data.favorites.length"
                    [matBadgeHidden]="appService.Data.favorites.length == 0"
                    matBadgeSize="small"
                    matBadgeColor="warn"
                    aria-hidden="false">favorite_border</mat-icon>
      </a>
      <!-- <a routerLink="/compare" mat-icon-button matTooltip="Comparador" fxShow="false" fxShow.gt-md class="mr-3 ml-2">
          <mat-icon [matBadge]="appService.Data.compareList.length"
                    [matBadgeHidden]="appService.Data.compareList.length == 0"
                    matBadgeSize="small"
                    matBadgeColor="warn"
                    aria-hidden="false">compare_arrows</mat-icon>
      </a>    -->
      <!-- <a routerLink="/register" mat-mini-fab color="primary" fxHide="false" fxHide.gt-xs><mat-icon>add</mat-icon></a> -->
      <span fxHide="false" fxHide.gt-sm>
        <button mat-button (click)="sidenavToggle()">
          <mat-icon class="mat-icon-md m-0">menu</mat-icon>
        </button>
      </span>

      <a *ngIf="!userService.isLoggedIn" routerLink="/register" mat-raised-button color="primary" fxShow="false" fxShow.gt-xs class="uppercase">{{ 'REGISTER' | translate }}</a>
      <ng-container *ngIf="userService.isLoggedIn">
        <app-user-menu></app-user-menu>
      </ng-container>
    </div>
  </div>
</mat-toolbar>
