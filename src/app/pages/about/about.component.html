<div class="theme-container">
  <div fxLayout="row wrap" fxLayoutAlign="space-around">
    <div fxFlex="100" fxFlex.gt-xs="33.3">
        <!-- <div fxLayout="column" fxLayoutAlign="center center" class="text-center"> -->
          <div fxLayout="column">
            <span class="dot div-center mt-4">01</span>
            <p class="mt-4 fw-700 fc-primary fs-1-5x">Misi&oacute;n</p>
            <p class="fc-primary fs-1x">Facilitar y acercar las viviendas de bancos y servicers tanto a grandes inversores como a particulares.</p>
        </div>
    </div>
    <div fxFlex="100" fxFlex.gt-xs="33.3">
        <div fxLayout="column">
          <span class="dot div-center mt-4">02</span>
          <p class="mt-4 fw-700 fc-primary fs-1-5x">Visi&oacute;n</p>
          <p class="fc-primary fs-1x">Democratizar la inversión en inmuebles procedentes de ejecuciones hipotecarias.</p>
      </div>
    </div>
    <div fxFlex="100" fxFlex.gt-xs="33.3">
      <div fxLayout="column">
        <span class="dot div-center mt-4">03</span>
        <p class="mt-4 fw-700 fc-primary fs-1-5x">Valores</p>
        <p class="fc-primary fs-1x">Transparencia, Seguridad Jurídica y Calidad.</p>
      </div>
    </div>
  </div>
</div>
