<div fxLayout="row wrap">
  <div fxFlex="100" fxFlex.gt-sm="100">
    <p class="horizontal-menu-active pt-4 pb-3 pl-3 uppercase">Favoritos</p>
    <!-- <p class="fc-primary fw-400 fs-1-5x ml-4 uppercase">Datos personales</p> -->
  </div>
</div>


<!-- Filtro
<mat-form-field appearance="outline" class="w-100">
  <input matInput (keyup)="applyFilter($event.target)" placeholder="Filter properties" autocomplete="off">
</mat-form-field> -->
<div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="w-100">

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let property"> {{property.id}} </td>
      </ng-container>

      <!-- Image Column -->
      <!-- <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef> Image </th>
        <td mat-cell *matCellDef="let property"><img [src]="property.gallery[0].small" [style.width.px]="100" class="d-block"></td>
      </ng-container> -->

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let property"><a [routerLink]="['/properties', property.id ]" class="property-name">{{property.title}}</a></td>
      </ng-container>

      <!-- Province Column -->
      <ng-container matColumnDef="province">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Provincia </th>
        <td mat-cell *matCellDef="let property"><a [routerLink]="['/properties', property.id ]" class="property-name">{{property.city}}</a></td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
        <td mat-cell *matCellDef="let property"><a [routerLink]="['/properties', property.id ]" class="property-name">{{property.propertyType}}</a></td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
        <td mat-cell *matCellDef="let property"><a [routerLink]="['/properties', property.id ]" class="property-name">{{property.propertyStatus}}</a></td>
      </ng-container>

      <!-- Status Column -->
      <!-- <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
        <td mat-cell *matCellDef="let property"><a [routerLink]="['/properties', property.id ]" class="property-name">{{property.title}}</a></td>
      </ng-container> -->

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let property">
            <button mat-icon-button color="warn" (click)="remove(property)" matTooltip="Eliminar" class="remove">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let property; columns: displayedColumns;">
      </tr>
    </table>
    <p *ngIf="dataSource?.data.length === 0" class="py-5 mb-0 text-center">No se han seleccionado favoritos</p>
</div>


<mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
