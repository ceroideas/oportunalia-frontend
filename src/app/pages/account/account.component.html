<div class="p-3">
    <div class="theme-container">

        <mat-sidenav-container class="account main-sidenav">
            <mat-sidenav #sidenav [opened]="sidenavOpen" [mode]="sidenavOpen ? 'side' : 'over'" class="account-sidenav">
                <!-- before <mat-card> -->
                <div>
                    <button fxHide="false" style="right: 18px;" fxHide.gt-sm mat-mini-fab color="warn" class="close" (click)="sidenav.toggle()">
                        <mat-icon style="position: relative; top: 3px;">close</mat-icon>
                    </button>
                    <!-- <mat-card-header fxLayoutAlign="start center">
                        <img mat-card-avatar src="assets/images/others/user.jpg" alt="avatar" class="mb-0">
                        <mat-card-title class="text-muted mb-0">Luis Campos</mat-card-title>
                    </mat-card-header> -->

                    <div *ngFor="let link of links" class="divider">

                        <a matLine [routerLink]="link.href" routerLinkActive="horizontal-menu-active" [routerLinkActiveOptions]="{exact:true}" fxLayout="row" fxLayoutAlign="start center" class="p-3 horizontal-menu-link">
                            <!-- <mat-icon class="text-muted">{{link.icon}}</mat-icon> -->
                            <span class="mx-2 fc-primary">{{ link.name }}</span>
                        </a>
                    </div>
                    <div class="btn">

                      <h2 class="btn-title fw-400 mt-7"><a href="/login"> <mat-icon>power_settings_new</mat-icon>&nbsp;&nbsp;&nbsp;Salir</a></h2>
                    </div>
                  </div>
            </mat-sidenav>
            <mat-sidenav-content ngClass.gt-sm="distance">
              <mat-card *ngIf="!sidenavOpen" fxLayout="row" fxLayoutAlign="space-between center" class="text-muted mb-3 p-3">
                  <button mat-icon-button (click)="sidenav.toggle()">
                      <mat-icon style="    position: relative;
    top: -4px;
    left: -2px;
    overflow: unset;">more_vert</mat-icon>
                  </button>
                  <h3>Mi cuenta</h3>
              </mat-card>
              <!-- before <mat-card> -->
              <div class="account-wrapper">
                  <router-outlet></router-outlet>
              </div>
            </mat-sidenav-content>
        </mat-sidenav-container>

    </div>
</div>
